# Builds the browser playground from main and deploys it to GitHub Pages.
# Repo settings: Pages -> Build and deployment -> Source = "GitHub Actions".
name: playground

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install ugl
        run: pip install .

      - name: Build site (encodes the gallery with the real encoder)
        run: python tools/build_playground.py --out _site

      # Run the built worker.js under Node and check its output matches CPython.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Smoke-test the site in Pyodide
        # imports the built worker.js as an ES module, exactly as the browser's
        # module worker does, using the site's own self-hosted Pyodide files
        run: |
          python -m http.server -d _site 8000 &
          sleep 2
          node tools/playground_smoke.mjs http://localhost:8000/ "$RUNNER_TEMP/smoke.json" _site
          python tools/build_playground.py --out _site --compare "$RUNNER_TEMP/smoke.json"

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-v1

      - name: Test the page in real browsers (Chromium + Firefox)
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium firefox
          python tools/playground_browser_test.py --site _site

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
