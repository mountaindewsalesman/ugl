[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "ugl"
version = "0.1.0"
description = "Universal grammatical language: English <-> numbered-concept notation with explicit scope, for precise low-token text"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "lemminflect>=0.2.3",
    "spacy>=3.8,<3.9",
    "en_core_web_md @ https://github.com/explosion/spacy-models/releases/download/en_core_web_md-3.8.0/en_core_web_md-3.8.0-py3-none-any.whl",
]

[project.optional-dependencies]
# rebuilding dictionaries / fetching corpora / evaluating sense choice
build = ["nltk>=3.9", "requests>=2.31"]
dev = ["pytest>=8", "nltk>=3.9", "requests>=2.31"]

[project.scripts]
ugl = "ugl.__main__:main"

[tool.setuptools]
packages = ["ugl"]

[tool.setuptools.package-data]
ugl = ["dictionary/*.json.gz", "dictionary/*.json", "dictionary/default.txt"]
