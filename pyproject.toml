[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "ugl"
version = "0.4.0"
description = "Universal grammatical language: English <-> numbered-concept notation with explicit scope, for precise low-token text"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "lemminflect>=0.2.3",
]

[project.optional-dependencies]
# English story models (ugl.lm): their byte-level BPE tokenizer; UGL models need nothing extra
lm = ["tokenizers>=0.15"]
# the legacy spaCy encoder; rebuilding dictionaries (spaCy counts the corpus and
# parses glosses); dev tools
spacy = ["spacy>=3.8,<3.9", "en_core_web_md @ https://github.com/explosion/spacy-models/releases/download/en_core_web_md-3.8.0/en_core_web_md-3.8.0-py3-none-any.whl"]
build = ["ugl[spacy]", "nltk>=3.9", "requests>=2.31", "torch>=2.2"]
dev = ["ugl[build]", "pytest>=8", "playwright>=1.40"]

[project.scripts]
ugl = "ugl.__main__:main"

[tool.setuptools]
packages = ["ugl", "ugl.parser"]

[tool.setuptools.package-data]
ugl = ["dictionary/*.json.gz", "dictionary/*.json", "dictionary/default.txt"]
"ugl.parser" = ["weights/*.npz"]
